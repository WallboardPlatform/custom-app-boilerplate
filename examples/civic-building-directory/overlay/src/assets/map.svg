<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Three-level civic building directory map</title>
  <desc id="map-description">A simplified, touch-friendly redraw of a three-level civic building with public departments, stairs, an elevator, entrances, and a central lobby.</desc>
  <defs>
    <filter id="zone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18302e" flood-opacity="0.14" />
    </filter>
    <pattern id="open-pattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#49615f" stroke-opacity="0.16" stroke-width="2" />
    </pattern>
  </defs>

