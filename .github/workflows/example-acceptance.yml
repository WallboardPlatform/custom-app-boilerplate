name: Example acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: example-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accept-example:
    name: Accept ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - airport-departures
          - kpi-operations
          - market-rotation-ticker
          - restaurant-menu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full example acceptance
        run: npm run example:accept -- ${{ matrix.example }}

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-acceptance
          if-no-files-found: warn
          path: |
            .tmp/acceptance/${{ matrix.example }}/preview/output/
            .tmp/deliveries/${{ matrix.example }}/
