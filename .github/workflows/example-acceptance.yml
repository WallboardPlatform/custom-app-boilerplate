name: Example acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: example-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    # The gates themselves take about two minutes; the headroom is for a slow browser download,
    # which has cancelled this job before.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          path: ~/.cache/ms-playwright

      # The browser binary is cached; its system libraries are not, so --with-deps still runs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate repository contracts
        run: npm run validate:repository

  accept-example:
    name: Accept ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - airport-departures
          - call-center-agent-status
          - campus-directory
          - civic-venue-pulse
          - curated-storyline
          - donor-directory
          - factory-safety-questionnaire
          - factory-safety-results-dashboard
          - global-office-clock
          - kpi-operations
          - live-agenda
          - lumen-media-program
          - manufacturing-andon
          - market-rotation-ticker
          - museum-welcome
          - newsroom-spotlight
          - pdf-document-workspace
          - pharmacy-pickup-queue
          - product-catalog
          - recognition-mosaic
          - restaurant-menu
          - single-hero-clock
          - spatial-wayfinding
          - veszprem-wayfinding
          - weather-window

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          path: ~/.cache/ms-playwright

      # The browser binary is cached; its system libraries are not, so --with-deps still runs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full example acceptance
        run: npm run example:accept -- ${{ matrix.example }}

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-acceptance
          if-no-files-found: warn
          path: |
            .tmp/acceptance/${{ matrix.example }}/preview/output/
            .tmp/deliveries/${{ matrix.example }}/
